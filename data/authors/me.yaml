bio: |
  Pronob Sarker is a Computer Science senior at Gettysburg College (graduating December 2026) preparing PhD applications in Artificial Intelligence. His work sits at the intersection of agentic AI, robust machine learning, and human-centered systems: he has built LLM agents with tool use, retrieval-augmented generation systems, and NLP-powered healthcare decision support, and has conducted research on fine-grained image classification, combinatorial puzzle generation, and graph theory. His throughline is building AI that works reliably in the real world, with and for people.

